<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Sociau</title>
    <link rel="icon" href="https://firebasestorage.googleapis.com/v0/b/sociau-27036.appspot.com/o/Icones%2FSociau_icon.svg?alt=media&token=ff0c834e-07b6-4a6b-9a42-1368846b08ab">
    <link rel="stylesheet" href="../../styles/root.css">
    <link rel="stylesheet" href="../../styles/top-menu.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="top-menu" style="background-color: #8b95d1;">
        <a class="logo" id="sociau_logo">
            <div class="logo-icon">
                <img src="https://firebasestorage.googleapis.com/v0/b/sociau-27036.appspot.com/o/Icones%2FSociau_icon.svg?alt=media&token=ff0c834e-07b6-4a6b-9a42-1368846b08ab"
                    alt="">
            </div>
            <img id="logo"
                src="https://firebasestorage.googleapis.com/v0/b/sociau-27036.appspot.com/o/Icones%2Fsociau_logo.png?alt=media&token=bce72623-50cd-4d5a-8525-bdb37cc1cfc7"
                alt="">
        </a>
        <nav class="menu">
            <ul id="menu-list">
                <li id="back"><a id="option" href="../../index.html">Voltar ao início</a></li>
                <li><a id="option" href="../quemSomos/index.html">Quem Somos</a></li>
                <li><a id="option" href="../queroAjudar/index.html">Quero Ajudar</a></li>
                <li><a id="option" href="../contato/index.html">Contato</a></li>
                <li id="login-btn-option">
                    <div class="logged-menu" id="on-logged">
                        <p>Olá, aumigo</p>
                        <img src="https://firebasestorage.googleapis.com/v0/b/sociau-27036.appspot.com/o/Icones%2FVector.png?alt=media&token=3b68bf1c-4d02-4b23-8183-925d9d56339c"
                            alt="">
                        <ul id="logged-options">
                            <li>
                                <a href="../novoAnimal/index.html">
                                    Cadastrar novo animal
                                </a>
                            </li>
                            <li>
                                <a href="../meuPerfil/index.html">
                                    Meu perfil / animais
                                </a>
                            </li>
                            <li>
                                <a href="../editarPerfil/index.html">
                                    Editar perfil
                                </a>
                            </li>
                            <li>
                                <a href="../alterarSenha/index.html">
                                    Alterar senha
                                </a>
                            </li>
                            <li>
                                <a id="logout-btn">
                                    Sair
                                </a>
                            </li>
                        </ul>
                    </div>
                    <a href="../login/index.html" id="login-btn">
                        <button class="button-login">Login/Cadastre-se</button>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="main-container">
        <section class="profile-section">
            <form class="profile-form">
                <div class="form-group">
                    <label for="whatsapp">WhatsApp</label>
                    <input type="text" id="whatsapp" placeholder="Digite seu número de WhatsApp">
                    <div class="check">
                        <input type="checkbox" id="whatsapp_visible">
                        <label for="whatsapp_visible">Tornar o WhatsApp visível?</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="secondary_whatsapp">WhatsApp Secundário</label>
                    <input type="text" id="secondary_whatsapp" placeholder="Digite outro número, se houver">
                    <div class="check">
                        <input type="checkbox" id="secondary_whatsapp_visible">
                        <label for="secondary_whatsapp_visible">Tornar o WhatsApp secundário visível?</label>
                    </div> 
                </div>

                <div class="form-group">
                    <label for="profile_photo">Foto Principal</label>
                    <input type="file" id="profile_photo">
                </div>

                <div class="form-group">
                    <label for="estado">Estado*</label>
                    <select id="estado">
                        <option>Paraíba</option>
                        <option>Outro Estado</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="cidade">Cidade*</label>
                    <select id="cidade">
                        <option value="" disabled selected hidden>Selecione sua cidade</option>
                        <option>Malta</option>
                        <option>Patos</option>
                        <option>Santa Luzia</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="site">Site</label>
                    <input type="text" id="site" placeholder="Se você faz parte de uma ONG, pode divulgar seu site">
                </div>

                <div class="form-group">
                    <label for="about">Sobre você</label>
                    <textarea id="about" placeholder="Escreva sobre você..."></textarea>
                </div>

                <button type="submit" class="save-button">Salvar</button>
                <button type="button" class="delete-button">Remover conta</button>
            </form>
        </section>
    </main>

    <script src="../../scripts/top-menu.js" type="module"></script>
</body>

</html>
